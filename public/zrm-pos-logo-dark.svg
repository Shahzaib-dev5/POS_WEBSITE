<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="100%" height="100%">
  <defs>
    <linearGradient id="posGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="swooshGradientDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cartGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="lineGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <g id="logo-mark">
    <!-- Speed Motion Lines -->
    <path d="M 38 152 L 125 152" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M 38 206 L 165 206" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M 80 240 L 140 240" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

    <!-- Swoosh Circle Enclosing Cart -->
    <path d="M 230 46 C 140 46 68 115 68 202 C 68 238 80 270 102 296 C 112 308 126 318 142 324 C 185 340 246 332 295 285 C 316 265 328 238 328 214" 
          fill="none" 
          stroke="url(#swooshGradientDark)" 
          stroke-width="11" 
          stroke-linecap="round" />

    <!-- POS Register Receipt -->
    <g transform="translate(178, 62)">
      <path d="M 0 45 L 6 12 L 18 18 L 30 10 L 42 18 L 54 12 L 60 45 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />
      <line x1="12" y1="26" x2="48" y2="26" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" />
      <line x1="12" y1="34" x2="48" y2="34" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Cash Register Body -->
    <g transform="translate(170, 105)">
      <rect x="0" y="0" width="138" height="74" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="3" />
      <rect x="12" y="14" width="22" height="18" rx="4" fill="#ffffff" />
      <rect x="42" y="14" width="22" height="18" rx="4" fill="#ffffff" />
      <rect x="72" y="14" width="22" height="18" rx="4" fill="#ffffff" />
      <rect x="102" y="14" width="22" height="18" rx="4" fill="#ffffff" />

      <rect x="12" y="40" width="22" height="18" rx="4" fill="#ffffff" />
      <rect x="42" y="40" width="22" height="18" rx="4" fill="#ffffff" />
      <rect x="72" y="40" width="22" height="18" rx="4" fill="#ffffff" />
      <rect x="102" y="40" width="22" height="18" rx="4" fill="#ffffff" />
    </g>

    <!-- Shopping Cart Basket -->
    <g id="cart-basket">
      <path d="M 125 125 L 158 125 L 202 246 L 298 246 L 312 170 L 175 170" 
            fill="none" 
            stroke="url(#cartGradientDark)" 
            stroke-width="17" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <line x1="125" y1="125" x2="160" y2="125" stroke="#60a5fa" stroke-width="16" stroke-linecap="round" />
    </g>

    <!-- Wheels of Cart -->
    <g id="cart-wheels">
      <circle cx="212" cy="282" r="18" fill="#38bdf8" />
      <circle cx="268" cy="282" r="18" fill="#38bdf8" />
    </g>
  </g>

  <!-- Typography for Dark Mode -->
  <g id="brand-text">
    <text x="360" y="222" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="124" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#ffffff">ZRM</text>

    <text x="682" y="222" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="124" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="url(#posGradientDark)">POS</text>

    <line x1="362" y1="248" x2="966" y2="248" stroke="url(#lineGradientDark)" stroke-width="5" stroke-linecap="round" />

    <text x="364" y="294" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="28" 
          font-weight="700" 
          fill="#cbd5e1" 
          letter-spacing="0.2">
      Smart Sales <tspan fill="#38bdf8" font-weight="900">•</tspan> Simple Management <tspan fill="#38bdf8" font-weight="900">•</tspan> Better Business
    </text>
  </g>
</svg>
